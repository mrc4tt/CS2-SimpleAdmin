name: Build and Publish

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**/README.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**/README.md'

env:
  PROJECT_PATH_CS2_SIMPLEADMIN: "CS2-SimpleAdmin/CS2-SimpleAdmin.csproj"
  PROJECT_NAME_CS2_SIMPLEADMIN: "CS2-SimpleAdmin"
  PROJECT_PATH_CS2_SIMPLEADMINAPI: "CS2-SimpleAdminApi/CS2-SimpleAdminApi.csproj"
  PROJECT_NAME_CS2_SIMPLEADMINAPI: "CS2-SimpleAdminApi"
  PROJECT_PATH_FUNCOMMANDSMODULE: "Modules/CS2-SimpleAdmin_FunCommands/CS2-SimpleAdmin_FunCommands/CS2-SimpleAdmin_FunCommands.csproj"
  PROJECT_NAME_FUNCOMMANDSMODULE: "CS2-SimpleAdmin_FunCommands"
  PROJECT_PATH_STEALTHMODULE: "Modules/CS2-SimpleAdmin_StealthModule/CS2-SimpleAdmin_StealthModule.csproj"
  PROJECT_NAME_STEALTHMODULE: "CS2-SimpleAdmin_StealthModule"
  OUTPUT_PATH: "./counterstrikesharp"
  TMP_PATH: "./tmp"

  # Bundled third-party plugins.
  # CS2MenuManager: tracks the latest Forgejo release dynamically from
  #   git.miksen.me/mikkel/CS2MenuManager (asset name varies per release, so a
  #   fixed pin is brittle). The NuGet `<PackageReference>` in csproj resolves
  #   from the same Forgejo package registry (see nuget.config) — the two are
  #   independent; bump the PackageReference version when the API changes.

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: cs2-build:latest
      # cs2-build:latest is built and cached locally on the Runner host.
      # Forgejo Runner must be told not to pull it: set
      # `container.force_pull: false` in the runner's config.yaml.
    outputs:
      build_version: ${{ steps.get_version.outputs.VERSION }}
      cs2mm_tag: ${{ steps.bundle.outputs.cs2mm_tag }}
    # Auth for the "forgejo" NuGet source (CS2MenuManager) in nuget.config.
    env:
      NuGetPackageSourceCredentials_forgejo: "Username=${{ secrets.FORGEJO_USER || 'mikkel' }};Password=${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}"
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      # The cs2-build image already contains: dotnet 10 SDK, zip, unzip, tar, git.
      # No "Install build tools" or "Setup .NET" step needed.

      - name: Get Version
        id: get_version
        run: echo "VERSION=$(cat CS2-SimpleAdmin/VERSION)" >> $GITHUB_OUTPUT

      - name: Restore & Build All Projects
        run: |
          dotnet restore ${{ env.PROJECT_PATH_CS2_SIMPLEADMIN }}
          dotnet build ${{ env.PROJECT_PATH_CS2_SIMPLEADMIN }} -c Release -o ${{ env.TMP_PATH }}/${{ env.PROJECT_NAME_CS2_SIMPLEADMIN }}
          dotnet restore ${{ env.PROJECT_PATH_CS2_SIMPLEADMINAPI }}
          dotnet build ${{ env.PROJECT_PATH_CS2_SIMPLEADMINAPI }} -c Release -o ${{ env.TMP_PATH }}/${{ env.PROJECT_NAME_CS2_SIMPLEADMINAPI }}
          dotnet restore ${{ env.PROJECT_PATH_FUNCOMMANDSMODULE }}
          dotnet build ${{ env.PROJECT_PATH_FUNCOMMANDSMODULE }} -c Release -o ${{ env.TMP_PATH }}/${{ env.PROJECT_NAME_FUNCOMMANDSMODULE }}
          dotnet restore ${{ env.PROJECT_PATH_STEALTHMODULE }}
          dotnet build ${{ env.PROJECT_PATH_STEALTHMODULE }} -c Release -o ${{ env.TMP_PATH }}/${{ env.PROJECT_NAME_STEALTHMODULE }}

      - name: Combine projects
        run: |
          mkdir -p ${{ env.OUTPUT_PATH }}/plugins/CS2-SimpleAdmin
          mkdir -p ${{ env.OUTPUT_PATH }}/plugins/CS2-SimpleAdmin_FunCommands
          mkdir -p ${{ env.OUTPUT_PATH }}/plugins/CS2-SimpleAdmin_StealthModule
          mkdir -p ${{ env.OUTPUT_PATH }}/shared/CS2-SimpleAdminApi

          cp -r ${{ env.TMP_PATH }}/${{ env.PROJECT_NAME_CS2_SIMPLEADMIN }}/* ${{ env.OUTPUT_PATH }}/plugins/CS2-SimpleAdmin/
          cp -r ${{ env.TMP_PATH }}/${{ env.PROJECT_NAME_FUNCOMMANDSMODULE }}/* ${{ env.OUTPUT_PATH }}/plugins/CS2-SimpleAdmin_FunCommands
          cp -r ${{ env.TMP_PATH }}/${{ env.PROJECT_NAME_STEALTHMODULE }}/* ${{ env.OUTPUT_PATH }}/plugins/CS2-SimpleAdmin_StealthModule
          cp -r ${{ env.TMP_PATH }}/${{ env.PROJECT_NAME_CS2_SIMPLEADMINAPI }}/* ${{ env.OUTPUT_PATH }}/shared/CS2-SimpleAdminApi/

      - name: Bundle runtime dependencies
        id: bundle
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Resolve a Forgejo release into (tag, first .zip asset URL) without jq
          # so we don't need extra packages in the cs2-build image.
          fetch_latest_release_info() {
            local repo="$1"        # e.g. "mikkel/CS2MenuManager"
            local out_tag_var="$2" # name of caller-side variable to set with tag
            local out_url_var="$3" # name of caller-side variable to set with asset URL
            local api_url="${GITHUB_SERVER_URL}/api/v1/repos/$repo/releases/latest"

            echo ">> Fetching latest release info for $repo"
            local json
            json=$(curl --fail --silent --show-error --location --retry 3 \
                   -H "Authorization: token ${FORGEJO_TOKEN}" "$api_url")

            local tag
            tag=$(printf '%s' "$json" \
              | grep -oE '"tag_name"[[:space:]]*:[[:space:]]*"[^"]+"' \
              | head -1 \
              | sed -E 's/.*"tag_name"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')

            local zip_url
            zip_url=$(printf '%s' "$json" \
              | grep -oE '"browser_download_url"[[:space:]]*:[[:space:]]*"[^"]+\.zip"' \
              | head -1 \
              | sed -E 's/.*"browser_download_url"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')

            if [ -z "$tag" ] || [ -z "$zip_url" ]; then
              echo "!! Could not parse latest release for $repo" >&2
              echo "$json" | head -40 >&2
              exit 1
            fi

            printf -v "$out_tag_var" '%s' "$tag"
            printf -v "$out_url_var" '%s' "$zip_url"
          }

          # Robust extractor: handles four common zip layouts —
          #   a) addons/counterstrikesharp/...   (server-relative)
          #   b) counterstrikesharp/...          (CSS-relative)
          #   c) plugins/ and/or shared/...      (CSS-content at zip root)
          #   d) <plugin>/                       (raw plugin folder)
          # In case (d) we drop the contents into plugins/$fallback_name/.
          bundle() {
            local name="$1" url="$2" fallback_name="$3"
            local tmpdir
            tmpdir=$(mktemp -d)

            echo ">> Downloading $name from $url"
            curl --fail --silent --show-error --location --retry 3 \
                 -H "Authorization: token ${FORGEJO_TOKEN}" \
                 --output "$tmpdir/dep.zip" "$url"
            unzip -q "$tmpdir/dep.zip" -d "$tmpdir/extract"

            if [ -d "$tmpdir/extract/addons/counterstrikesharp" ]; then
              cp -r "$tmpdir/extract/addons/counterstrikesharp/." "${{ env.OUTPUT_PATH }}/"
            elif [ -d "$tmpdir/extract/counterstrikesharp" ]; then
              cp -r "$tmpdir/extract/counterstrikesharp/." "${{ env.OUTPUT_PATH }}/"
            elif [ -d "$tmpdir/extract/plugins" ] || [ -d "$tmpdir/extract/shared" ]; then
              cp -r "$tmpdir/extract/." "${{ env.OUTPUT_PATH }}/"
            else
              echo "!! Unknown zip layout for $name; falling back to plugins/$fallback_name/"
              mkdir -p "${{ env.OUTPUT_PATH }}/plugins/$fallback_name"
              cp -r "$tmpdir/extract/." "${{ env.OUTPUT_PATH }}/plugins/$fallback_name/"
            fi

            rm -rf "$tmpdir"
          }

          # CS2MenuManager — track latest Forgejo release dynamically.
          fetch_latest_release_info "mikkel/CS2MenuManager" CS2MM_TAG CS2MM_URL
          bundle "CS2MenuManager ${CS2MM_TAG}" "$CS2MM_URL" "CS2MenuManager_MenuManager"
          echo "cs2mm_tag=${CS2MM_TAG}" >> "$GITHUB_OUTPUT"

          echo ">> Final bundled tree:"
          find "${{ env.OUTPUT_PATH }}" -maxdepth 4 -type d | sort

      - name: Zip Main Build Output
        run: zip -r CS2-SimpleAdmin-${{ steps.get_version.outputs.VERSION }}.zip ${{ env.OUTPUT_PATH }}

      - name: Stage release artifacts
        run: |
          mkdir -p release
          cp CS2-SimpleAdmin-${{ steps.get_version.outputs.VERSION }}.zip release/

      - name: Upload all artifacts
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: CS2-SimpleAdmin-Build-Artifacts
          path: |
            release/CS2-SimpleAdmin-${{ steps.get_version.outputs.VERSION }}.zip

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    container:
      image: cs2-build:latest
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: Download build artifacts
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: CS2-SimpleAdmin-Build-Artifacts
          path: release

      - name: Publish combined release
        uses: https://code.forgejo.org/actions/forgejo-release@v2
        with:
          direction: upload
          url: ${{ github.server_url }}
          repo: ${{ github.repository }}
          tag: build-${{ needs.build.outputs.build_version }}
          sha: ${{ github.sha }}
          title: CS2-SimpleAdmin-${{ needs.build.outputs.build_version }}
          release-dir: release
          override: true
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          release-notes: |
            Bundled third-party plugins (drop-in install — no separate downloads):
              • CS2MenuManager ${{ needs.build.outputs.cs2mm_tag }} (latest at build time)

            Place the files in your server as follows:

            - CS2-SimpleAdmin (everything bundled):
              Place the files inside the addons/counterstrikesharp directory.
              The required menu manager plugin is already included — no separate
              downloads needed.
              After the first launch, configure the plugin using the JSON config file at:
              addons/counterstrikesharp/configs/plugins/CS2-SimpleAdmin/CS2-SimpleAdmin.json

            Remember to restart or reload your game server after installing and configuring the plugins.
