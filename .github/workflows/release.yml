# Builds and publishes a release from a version tag (vX.Y.Z).
#
# This workflow is disabled on mrc4tt/SimpleAdmin, where releases are built and
# published from a local machine. It is kept for forks: enable Actions in your fork,
# set CS2-SimpleAdmin/VERSION and a "## [X.Y.Z]" section in CHANGELOG.md, then push
# tag vX.Y.Z.
#
# Retry or backfill one release: Actions -> Release -> Run workflow, tag vX.Y.Z.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish, e.g. v1.9.4"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Tag matches VERSION
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < CS2-SimpleAdmin/VERSION)
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match CS2-SimpleAdmin/VERSION $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0"

      - name: Build
        run: |
          set -euo pipefail
          build() {
            dotnet build "$1" -c Release -o "build/$2" --nologo
            mkdir -p "counterstrikesharp/$2"
            cp -r "build/$2/." "counterstrikesharp/$2/"
          }
          build CS2-SimpleAdmin/CS2-SimpleAdmin.csproj plugins/CS2-SimpleAdmin
          build CS2-SimpleAdminApi/CS2-SimpleAdminApi.csproj shared/CS2-SimpleAdminApi
          build Modules/CS2-SimpleAdmin_FunCommands/CS2-SimpleAdmin_FunCommands/CS2-SimpleAdmin_FunCommands.csproj plugins/CS2-SimpleAdmin_FunCommands
          build Modules/CS2-SimpleAdmin_StealthModule/CS2-SimpleAdmin_StealthModule.csproj plugins/CS2-SimpleAdmin_StealthModule

      # The release zip ships CS2MenuManager's runtime plugin, from the latest
      # mrc4tt/CS2MenuManager release.
      - name: Bundle CS2MenuManager
        id: cs2mm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view -R mrc4tt/CS2MenuManager --json tagName --jq .tagName)
          gh release download "$tag" -R mrc4tt/CS2MenuManager -p '*.zip' -O cs2mm.zip
          unzip -q cs2mm.zip -d cs2mm
          cp -r cs2mm/addons/counterstrikesharp/. counterstrikesharp/
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: zip -qr "CS2-SimpleAdmin-$VERSION.zip" counterstrikesharp

      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CS2MM_TAG: ${{ steps.cs2mm.outputs.tag }}
        run: |
          changes=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d')
          {
            echo "${changes:-See [CHANGELOG.md](CHANGELOG.md).}"
            echo
            echo "### Bundled"
            echo "- CS2MenuManager $CS2MM_TAG"
            echo
            echo "### Install"
            echo "Extract the zip into \`addons/\`. The required menu manager plugin is already included."
            echo "After the first launch, configure the plugin in \`addons/counterstrikesharp/configs/plugins/CS2-SimpleAdmin/CS2-SimpleAdmin.json\`, then restart or reload the server."
          } > notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          zip="CS2-SimpleAdmin-$VERSION.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$zip" --clobber
          else
            gh release create "$TAG" "$zip" --verify-tag \
              --title "CS2-SimpleAdmin $TAG" --notes-file notes.md
          fi
