name: Build
# Build check only. Releases are never made here: they are built and published
# from a local machine.
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
      - 'CHANGELOG.md'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0"

      - name: Language files are valid JSON
        run: |
          for f in CS2-SimpleAdmin/lang/*.json; do
            jq empty "$f" || { echo "::error file=$f::invalid JSON"; exit 1; }
          done

      - name: Build
        run: |
          set -euo pipefail
          build() {
            dotnet build "$1" -c Release -o "build/$2" --nologo
            mkdir -p "counterstrikesharp/$2"
            cp -r "build/$2/." "counterstrikesharp/$2/"
          }
          build CS2-SimpleAdmin/CS2-SimpleAdmin.csproj plugins/CS2-SimpleAdmin
          build CS2-SimpleAdminApi/CS2-SimpleAdminApi.csproj shared/CS2-SimpleAdminApi
          build Modules/CS2-SimpleAdmin_FunCommands/CS2-SimpleAdmin_FunCommands/CS2-SimpleAdmin_FunCommands.csproj plugins/CS2-SimpleAdmin_FunCommands
          build Modules/CS2-SimpleAdmin_StealthModule/CS2-SimpleAdmin_StealthModule.csproj plugins/CS2-SimpleAdmin_StealthModule

      # Same layout as a release zip, with CS2MenuManager's runtime from the latest
      # mrc4tt/CS2MenuManager release, for testing a commit on a server.
      - name: Bundle CS2MenuManager
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download -R mrc4tt/CS2MenuManager -p '*.zip' -O cs2mm.zip
          unzip -q cs2mm.zip -d cs2mm
          cp -r cs2mm/addons/counterstrikesharp/. counterstrikesharp/

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: CS2-SimpleAdmin-${{ github.sha }}
          path: counterstrikesharp
