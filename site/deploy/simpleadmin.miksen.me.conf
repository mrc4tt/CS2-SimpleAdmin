# CS2-SimpleAdmin documentation (the Astro site in CS2-SimpleAdmin's site/ folder, uploaded by
# site/deploy.sh over ssh as root). Cloudflare-proxied like img.miksen.me: ufw opens 443 to
# Cloudflare's ranges only. Static files only: no PHP, no backend.
# /srv/simpleadmin-docs/current is a symlink to the live release, so a deploy or rollback swaps one
# symlink.

map $http_cf_connecting_ip $sadocs_client {
    default  $http_cf_connecting_ip;
    ""       $remote_addr;
}
limit_conn_zone $sadocs_client zone=sadocs_conn:10m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name simpleadmin.miksen.me;

    ssl_certificate     /etc/letsencrypt/live/miksen-public/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/miksen-public/privkey.pem;

    root /srv/simpleadmin-docs/current;
    # Follow only symlinks owned like their target (all root-owned here).
    disable_symlinks if_not_owner from=/srv/simpleadmin-docs;
    index index.html;
    autoindex off;
    # "/reference/commands" -> "/reference/commands/" as a relative redirect (no http:// or port from
    # behind Cloudflare).
    absolute_redirect off;
    limit_conn sadocs_conn 16;
    limit_conn_status 429;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # The site's own 404 page (menu and search).
    error_page 404 /404.html;

    # Hashed file names: a new build gets new names, so these never change.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    # Search index: most file names are hashed, the entry files are not.
    location /pagefind/ {
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    # Pages: always revalidate, so a deploy shows at once (also through Cloudflare).
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
}
